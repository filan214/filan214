<svg xmlns="http://www.w3.org/2000/svg" width="420" height="110" viewBox="0 0 420 110" role="img" aria-labelledby="title desc">
<title id="title">Email — Valentinus Filan</title>
<desc id="desc">Send an email to valentinus.filan@gmail.com.</desc>
<style>
:root { color-scheme: light dark; --bg:#ffffff; --panel:#f6f8fa; --ink:#24292f; --muted:#59636e; --line:#d1d9e0; --accent:#16733c; --cyan:#0969da; --amber:#8a5700; --portrait:#353b43; --track:#e5e9ee; --p0:#ebedf0; --p1:#c6e8cb; --p2:#9bd7a4; --p3:#58b96b; --p4:#2a9345; --p5:#167036; }
@media (prefers-color-scheme: dark) {
 :root { --bg:#0d1117; --panel:#161b22; --ink:#e6edf3; --muted:#919ba7; --line:#30363d; --accent:#69f0a0; --cyan:#79c0ff; --amber:#e3b341; --portrait:#c9d1d9; --track:#21262d; --p0:#161b22; --p1:#0e4429; --p2:#006d32; --p3:#26a641; --p4:#39d353; --p5:#69f0a0; }
}
text { font-family:'Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',monospace; font-size:12px; fill:var(--ink); }
.bg {fill:var(--bg);stroke:var(--line)} .panel {fill:var(--panel)}
.ink {fill:var(--ink)} .muted {fill:var(--muted)} .accent {fill:var(--accent)} .cyan {fill:var(--cyan)} .amber {fill:var(--amber)} .portrait {fill:var(--portrait)}
.line {stroke:var(--line)} .track {fill:var(--track)} .small {font-size:10px} .tiny {font-size:9px} .large {font-size:22px;font-weight:600} .bold {font-weight:600}
.p0 {fill:var(--p0)} .p1 {fill:var(--p1)} .p2 {fill:var(--p2)} .p3 {fill:var(--p3)} .p4 {fill:var(--p4)} .p5 {fill:var(--p5)}
.unknown {fill:var(--bg);stroke:var(--line);stroke-dasharray:2 2}

:root{--brand:#0a66c2;--mail-wash:#e8f6ee}
@media(prefers-color-scheme:dark){:root{--brand:#4d9de0;--mail-wash:#11251c}}
.brand{fill:var(--brand)} .mail-wash{fill:var(--mail-wash)}
.mark{fill:#ffffff;font-family:Arial,Helvetica,sans-serif;font-weight:700}
.on-fill{fill:var(--bg);font-weight:700}
.stroke{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.body{fill:var(--mail-wash);stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.letter{fill:var(--bg);stroke:var(--accent);stroke-width:1.5}
.ink-line{stroke:var(--muted);stroke-width:1.5;stroke-linecap:round}
.ring{fill:none;stroke:var(--brand);stroke-width:2;opacity:0}
.letter,.ring{transform-box:fill-box;transform-origin:center}

@keyframes enter {from {opacity:0;transform:translateY(7px)} to {opacity:1;transform:translateY(0)}}
@keyframes drop {from {opacity:0;transform:translateY(-12px)} to {opacity:1;transform:translateY(0)}}
.enter {animation:enter .55s ease-out both}
.drop {animation:drop .35s ease-out both}

@keyframes rise{from{transform:translateY(10px)} to{transform:translateY(0)}}
@keyframes pulse{from{opacity:.7;transform:scale(1)} to{opacity:0;transform:scale(1.35)}}
@keyframes blink{50%{opacity:0}}
.letter{animation:rise .7s ease-out .5s both}
.ring{animation:pulse 1.4s ease-out .4s 2}
.cursor{animation:blink 1.1s steps(1) 1.6s infinite}

@media (prefers-reduced-motion: reduce) {
 * {animation:none !important} .wipe {clip-path:none !important}
 .tag-cycle {display:none} .tag-static {display:inline}
}
</style>
<g class="enter"><rect x="0.5" y="0.5" width="419" height="109" rx="12" class="bg" /><rect x="0" y="18" width="3" height="74" rx="1" class="accent" /><rect x="22" y="25" width="60" height="60" rx="14" class="mail-wash" /><g class="letter"><rect x="41" y="37" width="22" height="18" rx="2" class="letter" /><path d="M45 43h14M45 48h9" class="ink-line"/></g><rect x="37" y="46" width="30" height="21" rx="3" class="body" /><path d="M37 47L52 58L67 47" class="stroke"/><text x="100" y="44" class="accent bold" style="font-size:11px" >$</text><text x="112" y="44" class="muted" style="font-size:11px" >mail --to</text><defs><clipPath id="type-email" clipPathUnits="userSpaceOnUse"><rect x="98" y="54" width="226" height="22"><animate attributeName="width" values="0;0;226" keyTimes="0;0.21429;1" begin="0s" dur="1.400s" repeatCount="1" fill="freeze"/></rect></clipPath></defs><g class="wipe" clip-path="url(#type-email)"><text x="100" y="69" class="bold" style="font-size:13px">valentinus.filan@gmail.com<tspan class="cursor accent">▋</tspan></text></g><text x="100" y="92" class="muted tiny" >Opens your mail app</text><rect x="330" y="40" width="74" height="30" rx="15" class="accent" /><text x="367" y="60" class="on-fill" style="font-size:12px" text-anchor="middle">Write ↗</text></g>
</svg>
