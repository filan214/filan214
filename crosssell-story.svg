<svg xmlns="http://www.w3.org/2000/svg" width="860" height="424" viewBox="0 0 860 424" role="img" aria-labelledby="title desc">
<title id="title">Who should sales call first? — Dealership cross-sell story</title>
<desc id="desc">The Problem: A dealership had more customers than its sales team could ever call, and only 12.3% were interested. Working down the list at random meant most calls went nowhere. The Clue: So I started with the data. Grouping customers in SQL, one group stood out: drivers with a damaged car and no insurance said yes 25.1% of the time, against 12.3% overall. The Model: A pattern isn&#x27;t a plan, so I trained a model to score every customer on how likely they were to buy, and tested it on 76,222 customers it had never seen. The Payoff: Ranked by that score, calling only the top 30% reached 79.0% of interested customers, 2.6× better than random. Sales got it as a Tableau call list, with a slider to choose how far down to go. Figures quoted from the project README at commit 358d87e60c8110bbbf5d0cd3f7a45ebd27a5482d.</desc>
