<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-labelledby="title desc">
<title id="title">Who should sales call first? — Dealership cross-sell story</title>
<desc id="desc">Problem: only 12.3% of customers respond, and sales cannot call everyone. Insight: SQL analysis found Vehicle damage + not previously insured customers respond at 25.1%. Model: 76,222 unseen customers were scored and ranked by likelihood to buy. Impact: calling the top 30% reaches 79.0% of interested customers, 2.6× better than random. Delivered as a Tableau call list. Figures quoted from the project README at commit 56a1e0d6f569fe9a93ae5c1c0b1087f1724a8a25.</desc>
<style>
:root { color-scheme: light dark; --bg:#ffffff; --panel:#f6f8fa; --ink:#24292f; --muted:#59636e; --line:#d1d9e0; --accent:#16733c; --cyan:#0969da; --amber:#8a5700; --portrait:#353b43; --track:#e5e9ee; --p0:#ebedf0; --p1:#c6e8cb; --p2:#9bd7a4; --p3:#58b96b; --p4:#2a9345; --p5:#167036; }
