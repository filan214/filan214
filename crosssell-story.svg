y="192" class="display violet" style="font-size:30px" >76,222</text><text x="458" y="218" class="sans" style="font-size:11px" >unseen customers scored</text><text x="458" y="235" class="sans" style="font-size:11px" >on how likely each is to</text><text x="458" y="252" class="sans" style="font-size:11px" >buy, then ranked.</text></g><path d="M630 204h13l-4 -4m4 4l-4 4" class="connector"/><g class="enter" style="animation-delay:0.69s"><rect x="649" y="126" width="183" height="156" rx="10" class="v-wash" /><text x="665" y="150" class="violet bold" style="font-size:10px" >04 · IMPACT</text><text x="665" y="192" class="display violet" style="font-size:30px" >79.0%</text><text x="665" y="218" class="sans" style="font-size:11px" >of interested customers</text><text x="665" y="235" class="sans" style="font-size:11px" >reached via the top 30%,</text><text x="665" y="252" class="sans" style="font-size:11px" >2.6× better than random.</text></g><text x="28" y="310" class="sans" style="font-size:12px" >Delivered as a Tableau call list with a “top % to call” slider for the sales team.</text><text x="832" y="328" class="muted tiny" text-anchor="end">Figures from the project README · 56a1e0d</text></g>
