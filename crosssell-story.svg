="315" class="sans" style="font-size:13.5px">and tested it on <tspan class="violet bold">76,222</tspan> customers it had never seen.</text></g><g class="enter" style="animation-delay:0.75s"><circle cx="40" cy="334" r="6" class="violet"/><text x="64" y="338" class="violet bold" style="font-size:10px" >THE PAYOFF</text><text x="64" y="360" class="sans" style="font-size:13.5px">Ranked by that score, calling only the top <tspan class="violet bold">30%</tspan> reached <tspan class="violet bold">79.0%</tspan> of interested customers, <tspan class="violet bold">2.6×</tspan> better than random.</text><text x="64" y="379" class="sans" style="font-size:13.5px">Sales got it as a Tableau call list, with a slider to choose how far down to go.</text></g><text x="832" y="410" class="muted tiny" text-anchor="end">Figures from the project README · 358d87e</text></g>
