name: Update profile art

on:
  schedule:
    - cron: '17 0 * * *' # 07:17 Asia/Jakarta; GitHub schedules use UTC.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install daily dependencies only
        run: python -m pip install -r scripts/requirements.txt
      - name: Check data and renderer contracts
        run: python -m unittest discover -s tests -v
      - name: Refresh contributions
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py
      - name: Refresh latest public push
        run: |
          python scripts/fetch_last_event.py
          python scripts/render_commit_log.py
      - name: Refresh language bytes
        run: |
          python scripts/fetch_languages.py
          python scripts/render_languages_svg.py
      - name: Render manually maintained thesis status
        run: python scripts/render_status_bar.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: refresh profile art [skip ci]'
          file_pattern: 'data/*.json contrib-heatmap.svg commit-log.svg languages.svg thesis-progress.svg'
          commit_user_name: Valentinus Filan
          commit_user_email: valentinus.filan@gmail.com
          commit_author: Valentinus Filan <valentinus.filan@gmail.com>
