name: Update profile art

on:
  schedule:
    - cron: '17 * * * *' # Hourly at minute 17; scheduling may be delayed by GitHub.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install daily dependencies only
        run: python -m pip install -r scripts/requirements.txt
      - name: Check data and renderer contracts
        run: python -m unittest discover -s tests -v
      - name: Fetch current public projects and profile
        run: python scripts/fetch_builds.py
      - name: Fetch cross-repository public push stream
        run: python scripts/fetch_commit_stream.py
      - name: Refresh contributions
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py
      - name: Refresh featured repository commit
        run: |
          python scripts/fetch_last_event.py
          python scripts/render_commit_log.py
      - name: Refresh language bytes
        run: |
          python scripts/fetch_languages.py
          python scripts/render_languages_svg.py
      - name: Render live project panels and navigation
        run: |
          python scripts/render_build_spotlight.py
          python scripts/render_repo_sparklines.py
          python scripts/render_commit_stream.py
          python scripts/make_info_card.py
          python scripts/make_tagline.py
          python scripts/render_readme.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: refresh profile art [skip ci]'
          file_pattern: 'data/*.json README.md contrib-heatmap.svg commit-log.svg languages.svg recent-build.svg repo-activity-*.svg commit-stream.svg info-card.svg tagline.svg'
          commit_user_name: Valentinus Filan
          commit_user_email: valentinus.filan@gmail.com
          commit_author: Valentinus Filan <valentinus.filan@gmail.com>
