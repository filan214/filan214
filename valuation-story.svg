<svg xmlns="http://www.w3.org/2000/svg" width="860" height="424" viewBox="0 0 860 424" role="img" aria-labelledby="title desc">
<title id="title">Is this house priced fairly? — Jogja-House-Valuation story</title>
<desc id="desc">The Problem: House prices in Jogja are hard to judge. Buyers can&#x27;t tell if a listing is fair, sellers don&#x27;t know what to ask, and agents price mostly by experience. The Mess: The data was 2,020 scraped listings, and 474 were reposts of the same house. After clearing out reposts, boarding houses and land ads, 1,180 homes remained, each drop logged. The Test: The usual rule of thumb, price per m² times land size, missed by 46.1% on average. My model cut that to 25.6%, scored on whole districts it had never seen in training. The Answer: One number would overpromise, so the app gives a likely range, the reasons behind it, and similar listings. The range held 79.9% of prices in testing. On 30 listings from 2026, cheap homes ran high and pricey ones low. Figures quoted from the project README at commit 483188f8bab71341185abd13df1eb30792150001.</desc>
