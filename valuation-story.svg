t</text><text x="64" y="315" class="sans" style="font-size:13.5px">to <tspan class="violet bold">25.6%</tspan>, scored on whole districts it had never seen in training.</text></g><g class="enter" style="animation-delay:0.75s"><circle cx="40" cy="334" r="6" class="violet"/><text x="64" y="338" class="violet bold" style="font-size:10px" >THE ANSWER</text><text x="64" y="360" class="sans" style="font-size:13.5px">One number would overpromise, so the app gives a likely range, the reasons behind it, and similar listings.</text><text x="64" y="379" class="sans" style="font-size:13.5px">The range held <tspan class="violet bold">79.9%</tspan> of prices in testing. On <tspan class="violet bold">30</tspan> listings from 2026, cheap homes ran high and pricey ones low.</text></g><text x="832" y="410" class="muted tiny" text-anchor="end">Figures from the project README · 483188f</text></g>
